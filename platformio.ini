; #
; # BTT Kraken Robot Arm Controller
; # Uses Marlin's proven board configuration from parent directory
; #

[platformio]
boards_dir = buildroot/share/PlatformIO/boards

[env:btt_kraken]
; Based on Marlin's STM32H723ZG_btt configuration with micro-ROS support
platform = ststm32
board = marlin_STM32H723ZG
framework = arduino

; Board configuration - using 0x20000 offset for bootloader compatibility
board_build.offset = 0x20000
board_upload.offset_address = 0x08020000
board_build.variants_dir = buildroot/share/PlatformIO/variants

; Use Marlin's proven linker script for BTT Kraken
board_build.ldscript = buildroot/share/PlatformIO/variants/MARLIN_H723ZG/ldscript.ld

; micro-ROS configuration
lib_ldf_mode = chain+
board_microros_distro = humble
board_microros_transport = serial

build_flags = 
    ; Core MCU definitions
    -DSTM32H7xx 
    -DSTM32H723xx
    -DSTM32H723ZGTx
    
    ; Serial port definitions (critical for Kraken board)
    -DPIN_SERIAL1_TX=PA_9 -DPIN_SERIAL1_RX=PA_10
    -DPIN_SERIAL2_TX=PD_5 -DPIN_SERIAL2_RX=PD_6
    -DPIN_SERIAL3_TX=PD_8 -DPIN_SERIAL3_RX=PD_9
    -DPIN_SERIAL4_TX=PA_0 -DPIN_SERIAL4_RX=PA_1
    -DPIN_SERIAL7_TX=PE_8 -DPIN_SERIAL7_RX=PE_7
    -DSERIAL_RX_BUFFER_SIZE=1024 
    -DSERIAL_TX_BUFFER_SIZE=1024
    
    ; Timer configuration (needed for stepper motors and PWM)
    -DTIMER_SERVO=TIM5 
    -DTIMER_TONE=TIM2
    -DSTEP_TIMER_IRQ_PRIO=0
    
    ; USB High-Speed in Full-Speed mode (critical for USB communication)
    -DUSE_USB_HS 
    -DUSE_USB_HS_IN_FS
    -DUSBCON
    -DUSBD_USE_CDC
    -DHAL_PCD_MODULE_ENABLED
    
    ; USB CDC Framework flags
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DPIO_FRAMEWORK_ARDUINO_USB_HIGHSPEED_FULLMODE
    
    ; Cache and peripheral configuration
    -DD_CACHE_DISABLED
    -DRCC_PERIPHCLK_I2C35=RCC_PERIPHCLK_I2C5
    -UI2C5_BASE
    
    ; Vector table relocation for bootloader compatibility (0x20000 offset)
    -DVECT_TAB_OFFSET=0x20000
    
    ; Optimization flags
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-exceptions

build_unflags =
    ; Remove any conflicting flags
    -DUSER_VECT_TAB_ADDRESS

; Upload configuration
upload_protocol = cmsis-dap
debug_tool = cmsis-dap

; Library dependencies
lib_deps = 
    https://github.com/micro-ROS/micro_ros_platformio
    waspinator/AccelStepper@^1.64
    pfeerick/elapsedMillis@^1.0.6
    teemuatlut/TMCStepper@^0.7.3

; Monitor configuration
monitor_speed = 115200
monitor_filters = 
    default
    direct