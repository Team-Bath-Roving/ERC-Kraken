[env:btt_kraken]
platform = ststm32
board = btt_kraken
framework = arduino
lib_ldf_mode = chain+
board_microros_distro = humble
board_microros_transport = serial
board_build.variants_dir = custom_variants

; 1. Natively shift the firmware 128KB to make room for the BTT Bootloader
board_build.offset = 0x20000

build_flags = 
    ; 2. Enable USB CDC
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D PIO_FRAMEWORK_ARDUINO_USB_HIGHSPEED_FULLMODE
    -D USBCON
    
    ; 3. Shift the Interrupt Vector Table so timers and USB work
    -D USER_VECT_TAB_ADDRESS
    -D VECT_TAB_OFFSET=0x20000

lib_deps = 
    https://github.com/micro-ROS/micro_ros_platformio
    waspinator/AccelStepper@^1.64
    pfeerick/elapsedMillis@^1.0.6
    teemuatlut/TMCStepper@^0.7.3